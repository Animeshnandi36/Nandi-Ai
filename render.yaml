services:
  - type: web
    name: nandiai
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_CODE_MODEL
        value: openai/gpt-oss-120b
      - key: HF_API_TOKEN
        sync: false
      - key: HF_IMAGE_MODEL
        value: black-forest-labs/FLUX.1-dev
