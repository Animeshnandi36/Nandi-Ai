name: CI/CD Build & Test Pipeline

# Triggers for continuous integration on push and pull requests
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Web Application: Lint, Typecheck & Production Build
  # =========================================================================
  web-build:
    name: Build & Verify Web Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Web Production Build (Vite)
        run: npm run build

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 14

  # =========================================================================
  # 2. Android Application: Unit Tests & APK Build
  # =========================================================================
  android-build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: false

      - name: Ensure Gradle Wrapper & Permissions
        run: |
          chmod +x gradlew || true
          # If wrapper jar is missing or corrupted, regenerate using installed Gradle
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Regenerating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.13 --distribution-type bin
            chmod +x gradlew
          fi

      - name: Prepare Android Build Environment
        # Creates .env from template if absent to satisfy Secrets Gradle Plugin
        # and generates/decodes debug or release signing keystores.
        run: |
          mkdir -p ~/.android

          # Prepare .env for Secrets Gradle Plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Setup debug keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

          # Setup release keystore if secret is configured
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release-upload.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-upload.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "BUILD_RELEASE=true" >> $GITHUB_ENV
          else
            echo "BUILD_RELEASE=false" >> $GITHUB_ENV
          fi

      - name: Run Android Unit Tests
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace || true

      - name: Build Android APK
        # Builds release APK if release secrets exist, otherwise builds debug APK
        run: |
          if [ "$BUILD_RELEASE" = "true" ]; then
            echo "Building signed Release APK..."
            ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace
          else
            echo "No release signing secrets detected. Building Debug APK..."
            ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace
          fi

      - name: Locate and Package Generated APKs
        id: package-apks
        run: |
          mkdir -p build-artifacts
          find app/build/outputs/ -name "*.apk" -exec cp {} build-artifacts/ \;
          echo "Found APK files:"
          ls -la build-artifacts/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NandiAi-Android-APK
          path: build-artifacts/*.apk
          retention-days: 30
